syntax = "proto3";

package ecommerce.order;

option go_package = "ecommerce/order";

import "common.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  CREATED = 1;
  PAID = 2;
  SHIPPED = 3;
  COMPLETED = 4;
  CANCELLED = 5;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  common.Money unit_price = 4;
}

message Order {
  string id = 1;
  string user_id = 2;
  string user_email = 3;
  repeated OrderItem items = 4;
  common.Money subtotal = 5;
  common.Money discount = 6;
  common.Money shipping = 7;
  common.Money total = 8;
  string coupon_code = 9;
  common.Address shipping_address = 10;
  string status = 11;
  string tracking_id = 12;
  int64 created_at = 13;
}

message CreateOrderRequest {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
  string user_id = 2;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
  string tracking_id = 3; // optional — persisted when a shipment is created
}

message GetAllOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order);
  rpc GetAllOrders(GetAllOrdersRequest) returns (ListOrdersResponse);
}
