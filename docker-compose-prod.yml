name: boutique

services:
  postgres:
    container_name: postgres
    image: ghcr.io/kamal-v8/boutique/db-init:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    labels:
      - com.cent
    healthcheck:
      # Verify the app database exists (not just that postgres accepts TCP),
      # so DB-backed services never start before users_db/products_db/orders_db.
      test:
        [
          "CMD-SHELL",
          "psql -U $$POSTGRES_USER -d users_db -c 'SELECT 1' >/dev/null 2>&1",
        ]
      timeout: 5s
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      interval: 5s
      retries: 5
    labels:
      - com.cent

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Web UI via SSH tunnel only
    labels:
      - com.cent

  authservice:
    container_name: authservice
    image: ghcr.io/kamal-v8/boutique/authservice:latest
    restart: unless-stopped
    environment:
      PORT: "50051"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.cent

  cartservice:
    container_name: cartservice
    image: ghcr.io/kamal-v8/boutique/cartservice:latest
    restart: unless-stopped
    environment:
      PORT: "50053"
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - com.cent

  checkoutservice:
    container_name: checkoutservice
    image: ghcr.io/kamal-v8/boutique/checkoutservice:latest
    restart: unless-stopped
    environment:
      PORT: "50054"
      CART_SERVICE_ADDR: cartservice:50053
      PRODUCT_SERVICE_ADDR: productcatalog:50052
      PROMOTION_SERVICE_ADDR: promotionservice:50059
      SHIPPING_SERVICE_ADDR: shippingservice:50057
      ORDER_SERVICE_ADDR: orderservice:50055
      PAYMENT_SERVICE_ADDR: paymentservice:50056
      EMAIL_SERVICE_ADDR: emailservice:50058
    depends_on:
      - cartservice
      - paymentservice
      - promotionservice
      - productcatalog
      - shippingservice
      - orderservice
      - emailservice
    labels:
      - com.cent

  emailservice:
    container_name: emailservice
    image: ghcr.io/kamal-v8/boutique/emailservice:latest
    restart: unless-stopped
    environment:
      PORT: "50058"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      ORDER_SERVICE_ADDR: orderservice
      AUTH_SERVICE_ADDR: authservice
    depends_on:
      - authservice
      - orderservice
    labels:
      - com.cent

  orderservice:
    image: ghcr.io/kamal-v8/boutique/orderservice:latest
    restart: unless-stopped
    environment:
      PORT: "50055"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.cent

  paymentservice:
    image: ghcr.io/kamal-v8/boutique/paymentservice:latest
    restart: unless-stopped
    environment:
      PORT: "50056"
    labels:
      - com.cent

  productcatalog:
    image: ghcr.io/kamal-v8/boutique/productcatalog:latest
    restart: unless-stopped
    environment:
      PORT: "50052"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/products_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.cent

  promotionservice:
    image: ghcr.io/kamal-v8/boutique/promotionservice:latest
    restart: unless-stopped
    environment:
      PORT: "50059"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/products_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.cent

  shippingservice:
    image: ghcr.io/kamal-v8/boutique/shippingservice:latest
    restart: unless-stopped
    environment:
      PORT: "50057"
    labels:
      - com.cent

  frontend:
    image: ghcr.io/kamal-v8/boutique/frontend:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      AUTH_SERVICE_ADDR: authservice:50051
      PRODUCT_SERVICE_ADDR: productcatalog:50052
      CART_SERVICE_ADDR: cartservice:50053
      PROMOTION_SERVICE_ADDR: promotionservice:50059
      CHECKOUT_SERVICE_ADDR: checkoutservice:50054
      ORDER_SERVICE_ADDR: orderservice:50055
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - authservice
      - productcatalog
      - cartservice
      - promotionservice
      - checkoutservice
      - orderservice
    labels:
      - com.cent
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`zaptor.in`) || Host(`www.zaptor.in`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt

  traefik:
    container_name: traefik
    image: traefik:v3.6.1
    restart: unless-stopped
    labels:
      - com.cent
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/ubuntu/traefik/acme.json:/acme.json
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --log.level=INFO

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - /root/.docker/config.json:/config.json:ro # if a private repo for GHCR auth
    environment:
      - WATCHTOWER_CLEANUP=true # removes old images after update
      - WATCHTOWER_POLL_INTERVAL=6767 # ~1h53m
      - DOCKER_API_VERSION=1.45
    command: --label-enable # only watch containers with the com.cent label
volumes:
  postgres_data:
