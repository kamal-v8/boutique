name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Test
        run: npm test

  Node-Services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [authservice, cartservice, orderservice, paymentservice, emailservice]

    defaults:
      run:
        working-directory: ./services/${{ matrix.service  }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/node_modules
          key: node-${{ matrix.service }}-${{ hashFiles(format('services/{0}/package-lock.json',matrix.service)) }}
          restore-keys: |
            node-${{ matrix.service }}-

      - name: Install Dependencies
        run: npm  install

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          test_script=$(node -p "const s=require('./package.json').scripts||{}; s.test||''")
          if [ -n "$test_script" ]; then
            npm test
          else
            echo "No test script defined, skipping"
          fi

  Go-Services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          [productcatalog, checkoutservice, shippingservice, promotionservice]

    defaults:
      run:
        working-directory: ./services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Build
        run: GOWORK=off go build -mod=vendor ./...

      - name: Lint
        run: go vet ./...

  proto-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: keepCase guard (prevents cart-killer bug)
        run: |
          for f in services/*/index.js; do
            if grep -q "proto-loader" "$f" && ! grep -q "keepCase: true" "$f"; then
              echo "::error::missing 'keepCase: true' in $f - field names would become camelCase and break proto consumers"
              exit 1
            fi
          done
          echo "keepCase: true present in all proto-loading services"
